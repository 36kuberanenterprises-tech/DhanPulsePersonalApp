name: Build DhanPulse APK

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths:
      - 'android-app/**'
      - 'backend/**'
      - '.github/workflows/build-apk.yml'
  push:
    branches: [ update-stable-build63, fix/session-feed-build64, fix/build66-market-data-quality, feature/keep-eye-finder-build67, fix/keep-eye-build68-stable, fix/build69-keep-eye-watchlist-view, installable/build69-watchlist-preview, installable/live-movers-build70, fix/build71-login-backend-diagnostics, fix/build72-allow-login-while-health-checking, feature/build73-native-background-monitor, fix/build74-login-readiness, fix/build75-login-recovery, fix/build76-market-direction, fix/build77-selected-market-screen-awake, feature/flow-footprint-coverage-build78, feature/flow-candle-chart-build79, feature/build80-azure-tailnet-live-20261111, feature/build81-flow-auto-paper-20261111, fix/build83-video-error-diagnostics-20261113 ]
    paths:
      - 'android-app/**'
      - 'backend/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      apk_version: ${{ steps.apk_version.outputs.version }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Check backend JavaScript syntax
        run: |
          node --check backend/src/angel.js
          node --check backend/src/history-control.js
          node --check order-relay/src/server.js
          node --check backend/src/analysis.js
          node --check backend/src/sensex-strategies.js
          node --check backend/src/sensex-systems.js
          node --check backend/src/live-stream.js
          node --check backend/src/backtest.js
          node --check backend/src/backtest-catalog.js
          node --check backend/src/server.js
          node --check backend/src/stock-scanner.js
          node --check backend/src/keep-eye-finder.js

      - name: Test live market rules
        working-directory: backend
        run: |
          npm install --no-audit --no-fund
          npm test

      - name: Prepare Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "sdk.dir=$ANDROID_HOME" > android-app/local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Ensure Android app does not hardcode the old Render backend
        run: |
          if grep -R -F "https://dhanpulse-personal-api.onrender.com" android-app/app/src/main/java; then
            echo "Found obsolete Render backend URL in Android app"
            exit 1
          fi

      - name: Build verified video diagnostics APK
        working-directory: android-app
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Check installer app label
        run: |
          version=$(sed -nE 's/^val appVersion = "([^"]+)"/\1/p' android-app/app/build.gradle.kts)
          test -n "$version"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging android-app/app/build/outputs/apk/debug/app-debug.apk | grep -F "application-label:'DhanPulse Monitor 83'"

      - name: Rename APK
        id: apk_version
        run: |
          version=$(sed -nE 's/^val appVersion = "([^"]+)"/\1/p' android-app/app/build.gradle.kts)
          test -n "$version"
          cp android-app/app/build/outputs/apk/debug/app-debug.apk "DhanPulse-v${version}-Build83-Video-Diagnostics.apk"
          echo "APK_VERSION=$version" >> "$GITHUB_ENV"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DhanPulse-Monitor-Build83-Test-APK
          path: |
            DhanPulse-v${{ env.APK_VERSION }}-Build83-Video-Diagnostics.apk
          if-no-files-found: error
          retention-days: 30


  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/fix/build83-video-error-diagnostics-20261113'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download tested APK
        uses: actions/download-artifact@v4
        with:
          name: DhanPulse-Monitor-Build83-Test-APK

      - name: Publish direct Build 83 APK link
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="DhanPulse-v2.9.7-Build83-Video-Diagnostics.apk"
          test -s "$apk"
          gh release create "build83-video-diagnostics-20261113" "$apk" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "DhanPulse Build 83 Video Diagnostics Preview" \
            --notes "Build 83 displays read only Azure candle diagnostics, avoids historical backtests during an active cooldown, and shows Flow reconnect status. It preserves Build 81 market tabs and trading restrictions. Azure backend update required to expose diagnostics and reconnect functionality. Physical device testing is still required." \
            --prerelease

name: Build DhanPulse APK

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths:
      - 'android-app/**'
      - 'backend/**'
      - '.github/workflows/build-apk.yml'
  push:
    branches: [ main, add-mcx-index-options-v26, add-mcx-energy-options-v261 ]
    paths:
      - 'android-app/**'
      - 'backend/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      apk_version: ${{ steps.apk_version.outputs.version }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Check backend JavaScript syntax
        run: |
          node --check backend/src/angel.js
          node --check backend/src/analysis.js
          node --check backend/src/sensex-strategies.js
          node --check backend/src/live-stream.js
          node --check backend/src/backtest.js
          node --check backend/src/backtest-catalog.js
          node --check backend/src/server.js
          node --check backend/src/stock-scanner.js

      - name: Test live market rules
        working-directory: backend
        run: |
          npm install --no-audit --no-fund
          npm test

      - name: Prepare Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "sdk.dir=$ANDROID_HOME" > android-app/local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        working-directory: android-app
        run: gradle --no-daemon :app:assembleDebug

      - name: Check installer app label
        run: |
          version=$(sed -nE 's/^val appVersion = "([^"]+)"/\1/p' android-app/app/build.gradle.kts)
          test -n "$version"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging android-app/app/build/outputs/apk/debug/app-debug.apk | grep -F "application-label:'DhanPulse $version Preview'"

      - name: Rename APK
        id: apk_version
        run: |
          version=$(sed -nE 's/^val appVersion = "([^"]+)"/\1/p' android-app/app/build.gradle.kts)
          test -n "$version"
          cp android-app/app/build/outputs/apk/debug/app-debug.apk "DhanPulse-Personal-v${version}-Preview.apk"
          echo "APK_VERSION=$version" >> "$GITHUB_ENV"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DhanPulse-Personal-v${{ env.APK_VERSION }}-Preview-APK
          path: DhanPulse-Personal-v${{ env.APK_VERSION }}-Preview.apk
          if-no-files-found: error
          retention-days: 30

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified APK
        uses: actions/download-artifact@v4
        with:
          name: DhanPulse-Personal-v${{ needs.build.outputs.apk_version }}-Preview-APK

      - name: Publish direct APK download
        env:
          GH_TOKEN: ${{ github.token }}
          APK_VERSION: ${{ needs.build.outputs.apk_version }}
        run: |
          tag="v${APK_VERSION}"
          apk="DhanPulse-Personal-${tag}-Preview.apk"
          test -s "$apk"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists. Bump the app version for a new APK."
            exit 1
          fi
          gh release create "$tag" "$apk" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "DhanPulse Personal $tag Preview" --notes "Android preview build. Broker candle access still requires a verified outbound route." --prerelease

name: Build DhanPulse APK

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths:
      - 'android-app/**'
      - 'backend/**'
      - '.github/workflows/build-apk.yml'
  push:
    branches: [ update-stable-build63, fix/session-feed-build64, fix/build66-market-data-quality, feature/keep-eye-finder-build67, fix/keep-eye-build68-stable, fix/build69-keep-eye-watchlist-view, installable/build69-watchlist-preview, installable/live-movers-build70, fix/build71-login-backend-diagnostics, fix/build72-allow-login-while-health-checking, feature/build73-native-background-monitor, fix/build74-login-readiness, fix/build75-login-recovery, fix/build76-market-direction, fix/build77-selected-market-screen-awake, feature/flow-footprint-coverage-build78, feature/flow-candle-chart-build79, feature/build80-azure-tailnet-live-20261111, feature/build81-flow-auto-paper-20261111, feature/build82-private-mpin-totp-only-20261111 ]
    paths:
      - 'android-app/**'
      - 'backend/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      apk_version: ${{ steps.apk_version.outputs.version }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Check backend JavaScript syntax
        run: |
          node --check backend/src/angel.js
          node --check backend/src/history-control.js
          node --check order-relay/src/server.js
          node --check backend/src/analysis.js
          node --check backend/src/sensex-strategies.js
          node --check backend/src/sensex-systems.js
          node --check backend/src/live-stream.js
          node --check backend/src/backtest.js
          node --check backend/src/backtest-catalog.js
          node --check backend/src/server.js
          node --check backend/src/stock-scanner.js
          node --check backend/src/keep-eye-finder.js

      - name: Test live market rules
        working-directory: backend
        run: |
          npm install --no-audit --no-fund
          npm test

      - name: Prepare Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "sdk.dir=$ANDROID_HOME" > android-app/local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Ensure Android app does not hardcode the old Render backend
        run: |
          if grep -R -F "https://dhanpulse-personal-api.onrender.com" android-app/app/src/main/java; then
            echo "Found obsolete Render backend URL in Android app"
            exit 1
          fi

      - name: Set up private server configuration
        env:
          PRIVATE_URL: ${{ secrets.DHANPULSE_PRIVATE_BACKEND_URL }}
          REPO_PRIVATE: ${{ github.event.repository.private }}
        shell: bash
        run: |
          if [[ "$REPO_PRIVATE" == "true" ]]; then
            if [[ ! "$PRIVATE_URL" =~ ^https://[a-zA-Z0-9-]+(\.[a-zA-Z0-9-]+)+\.ts\.net/?$ ]]; then
              echo "::error::The private Tailscale URL is not configured. Set DHANPULSE_PRIVATE_BACKEND_URL as a repository Actions secret."
              exit 1
            fi
            echo "DHANPULSE_PRIVATE_BACKEND_URL=$PRIVATE_URL" >> "$GITHUB_ENV"
          else
            # Public repo: validate compilation only, never upload a personally
            # provisioned APK or store a real private host in public artifacts.
            echo "DHANPULSE_PRIVATE_BACKEND_URL=https://unconfigured.invalid" >> "$GITHUB_ENV"
            echo "Validating a placeholder build. A private repository and an Actions secret are required before distributing a personalised APK."
          fi

      - name: Build private login Android APK
        working-directory: android-app
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Check installer app label
        run: |
          version=$(sed -nE 's/^val appVersion = "([^"]+)"/\1/p' android-app/app/build.gradle.kts)
          test -n "$version"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging android-app/app/build/outputs/apk/debug/app-debug.apk | grep -F "application-label:'DhanPulse Monitor 82'"

      - name: Rename APK
        id: apk_version
        run: |
          version=$(sed -nE 's/^val appVersion = "([^"]+)"/\1/p' android-app/app/build.gradle.kts)
          test -n "$version"
          cp android-app/app/build/outputs/apk/debug/app-debug.apk "DhanPulse-v${version}-Build82-Private-Login.apk"
          echo "APK_VERSION=$version" >> "$GITHUB_ENV"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        if: github.event.repository.private == true
        uses: actions/upload-artifact@v4
        with:
          name: DhanPulse-Monitor-Build82-Private-APK
          path: |
            DhanPulse-v${{ env.APK_VERSION }}-Build82-Private-Login.apk
          if-no-files-found: error
          retention-days: 30


  publish:
    if: github.event.repository.private == true && github.ref == 'refs/heads/feature/build82-private-mpin-totp-only-20261111'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download tested APK
        uses: actions/download-artifact@v4
        with:
          name: DhanPulse-Monitor-Build82-Private-APK

      - name: Publish private Build 82 APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="DhanPulse-v2.9.7-Build82-Private-Login.apk"
          test -s "$apk"
          gh release create "build82-private-mpin-totp-20261111" "$apk" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "DhanPulse Build 82 Private Login Preview" \
            --notes "Build 82 hides the configured private Tailscale host and all account identifiers from the login screen. Only MPIN and fresh TOTP are requested. The internal endpoint comes from a private GitHub Actions secret. It preserves Build 81 Flow and opt in stock paper tracking. PIN and TOTP are never stored. The source code does not contain the private host. This APK is distributed only from a private repository and must be tested on an Android device." \
            --prerelease

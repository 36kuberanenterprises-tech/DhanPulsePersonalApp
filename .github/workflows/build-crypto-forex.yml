name: Build DhanPulse Crypto Forex v2.2 Quality APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'v220-src/**'
      - '.github/workflows/build-crypto-forex.yml'

permissions:
  contents: read

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Reconstruct DhanPulse v2.2 project
        run: |
          cat \
            v220-src/project.part00 \
            v220-src/project.part01 \
            v220-src/project.part02 \
            v220-src/project.part03_04a \
            v220-src/project.part04b0_04b1 \
            v220-src/project.part04c_04d \
            v220-src/project.part04e_04f \
            v220-src/project.part05_06 \
            | base64 -d > /tmp/dhanpulse-v220-project.zip
          unzip -t /tmp/dhanpulse-v220-project.zip
          rm -rf crypto-forex-app/buildsrc
          mkdir -p crypto-forex-app/buildsrc
          unzip -q /tmp/dhanpulse-v220-project.zip -d crypto-forex-app/buildsrc
          grep -n 'applicationId\|versionCode\|versionName' crypto-forex-app/buildsrc/app/build.gradle.kts
          grep -n 'Version 2.2 Quality Controlled' crypto-forex-app/buildsrc/app/src/main/assets/index.html

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "sdk.dir=$ANDROID_HOME" > crypto-forex-app/buildsrc/local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build installable debug APK
        working-directory: crypto-forex-app/buildsrc
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare APK artifact
        run: |
          cp crypto-forex-app/buildsrc/app/build/outputs/apk/debug/app-debug.apk DhanPulse_Crypto_Forex_v2.2.0_Quality_Controlled.apk
          sha256sum DhanPulse_Crypto_Forex_v2.2.0_Quality_Controlled.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DhanPulse-Crypto-Forex-v2.2.0-Quality-Controlled
          path: DhanPulse_Crypto_Forex_v2.2.0_Quality_Controlled.apk
          if-no-files-found: error
          retention-days: 30

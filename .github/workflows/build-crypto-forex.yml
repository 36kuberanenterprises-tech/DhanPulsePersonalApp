name: Build DhanPulse Crypto Forex v2.3 Research APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'v220-src/**'
      - 'v23-patch/**'
      - '.github/workflows/build-crypto-forex.yml'

permissions:
  contents: read

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Reconstruct DhanPulse v2.2 base
        run: |
          cat \
            v220-src/project.part00 \
            v220-src/project.part01 \
            v220-src/project.part02 \
            v220-src/project.part03_04a \
            v220-src/project.part04b0_04b1 \
            v220-src/project.part04c_04d \
            v220-src/project.part04e \
            v220-src/project.part04f \
            v220-src/project.part05_06 \
            | base64 -d > /tmp/dhanpulse-v220-project.zip
          unzip -t /tmp/dhanpulse-v220-project.zip
          rm -rf crypto-forex-app/buildsrc
          mkdir -p crypto-forex-app/buildsrc
          unzip -q /tmp/dhanpulse-v220-project.zip -d crypto-forex-app/buildsrc

      - name: Apply V2.3 research adaptive patch
        run: |
          cat \
            v23-patch/part00.txt \
            v23-patch/part01.txt \
            v23-patch/part02.txt \
            v23-patch/part03.txt \
            v23-patch/part04.txt \
            v23-patch/part05.txt \
            v23-patch/part06.txt \
            v23-patch/part07.txt \
            > /tmp/v23_patch.py
          python - <<'PY'
          from pathlib import Path
          p=Path('/tmp/v23_patch.py')
          x=p.read_text()
          x=x.replace("block='/* V2.3 research adaptive", "block='''/* V2.3 research adaptive", 1)
          x=x.replace("window.__nativeDecisionAuthority=false;'\ns=s[:start]+block+s[end:]", "window.__nativeDecisionAuthority=false;'''\ns=s[:start]+block+s[end:]", 1)
          p.write_text(x)
          PY
          python /tmp/v23_patch.py
          grep -n 'applicationId\|versionCode\|versionName' crypto-forex-app/buildsrc/app/build.gradle.kts
          grep -n 'Version 2.3 Research Adaptive' crypto-forex-app/buildsrc/app/src/main/assets/index.html
          python - <<'PY'
          from pathlib import Path
          s=Path('crypto-forex-app/buildsrc/app/src/main/assets/index.html').read_text()
          js=s[s.index('<script>')+8:s.rindex('</script>')]
          Path('/tmp/app.js').write_text(js)
          PY
          node --check /tmp/app.js

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "sdk.dir=$ANDROID_HOME" > crypto-forex-app/buildsrc/local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build installable debug APK
        working-directory: crypto-forex-app/buildsrc
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare APK artifact
        run: |
          cp crypto-forex-app/buildsrc/app/build/outputs/apk/debug/app-debug.apk DhanPulse_Crypto_Forex_v2.3.0_Research_Adaptive.apk
          sha256sum DhanPulse_Crypto_Forex_v2.3.0_Research_Adaptive.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DhanPulse-Crypto-Forex-v2.3.0-Research-Adaptive
          path: DhanPulse_Crypto_Forex_v2.3.0_Research_Adaptive.apk
          if-no-files-found: error
          retention-days: 30
